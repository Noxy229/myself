<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAC // TERMINAL ACCESS</title>
    <link rel="stylesheet" href="style.css?v=2">
    <!-- Google Fonts: Fira Code & Russo One (for headers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Russo+One&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- 3D Intro Container -->
    <div id="webgl-container" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 100; transition: opacity 1s;"></div>
    
    <div id="intro-overlay" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 101; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); transition: opacity 0.5s;">
        <button id="start-btn" style="padding: 15px 30px; font-family: 'Orbitron', sans-serif; font-size: 24px; background: transparent; color: #ff0000; border: 2px solid #ff0000; cursor: pointer; text-shadow: 0 0 10px #ff0000; box-shadow: inset 0 0 10px #ff0000;">INITIALIZE SEQUENCE</button>
    </div>

    <div class="scanlines" style="z-index: 10;"></div>
    <div class="overlay" style="z-index: 10;"></div>
    <div class="vignette" style="z-index: 10;"></div>

    <div class="terminal-container" style="z-index: 11;">
        <div class="terminal-header">
            <div class="uac-logo">UAC</div>
            <div class="title">SYSTEM STATUS: <span class="blink-warning">CRITICAL</span> // ID: noxy229</div>
            <div class="uac-装饰">|||</div>
        </div>

        <div class="terminal-window" id="terminal-window">
            <div id="output"></div>
            <div class="input-line">
                <span class="prompt">[UAC] noxy229@mars-base:~$</span>
                <input type="text" id="command-input" autocomplete="off" spellcheck="false" autocorrect="off"
                    autocapitalize="off" autofocus>
            </div>
        </div>

        <div class="terminal-footer">
            <span>UNION AEROSPACE CORPORATION</span>
            <span>LEVEL 5 CLEARANCE</span>
        </div>
    </div>

    <div id="achievement-popup" class="achievement-popup">
        <div class="achievement-icon">🏆</div>
        <div class="achievement-text">
            <span class="achievement-title">ACHIEVEMENT UNLOCKED</span>
            <span class="achievement-name">MASTER HACKER</span>
            <span class="achievement-desc">You cracked the system! Screenshot this and DM me on Discord.</span>
        </div>
    </div>
    <script src="script.js"></script>
    <script type="module" src="intro.js"></script>
</body>

</html>
