<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lennox_OS Workspace</title>
    <meta name="description" content="Lennox Nordmann - Systems Architect // AI Infrastructure. Fachinformatiker (Systemintegration) building homelabs, self-hosted infrastructure and intelligent systems.">
    <meta name="author" content="Lennox Nordmann">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Lennox_OS Workspace - Lennox Nordmann">
    <meta property="og:description" content="Systems Architect // AI Infrastructure. Proxmox, Docker, Linux, AI Agents. Boot the workspace and explore.">
    <meta property="og:site_name" content="Lennox_OS">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Lennox_OS Workspace - Lennox Nordmann">
    <meta name="twitter:description" content="Systems Architect // AI Infrastructure. Proxmox, Docker, Linux, AI Agents.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="os/os.css">
</head>
<body>
    <div id="boot-screen">
        <button id="boot-btn" type="button">Init_Workspace</button>
    </div>
    <main id="desktop" aria-label="Lennox_OS desktop" inert>
        <h1 class="sr-only">Lennox Nordmann - Lennox_OS Workspace</h1>
        <nav id="desktop-icons" aria-label="Desktop applications and files"></nav>
        <div id="selection-box" hidden></div>
        <div id="snap-preview" hidden aria-hidden="true"></div>
        <div id="windows"></div>
        <nav id="taskbar" aria-label="Taskbar">
            <button id="start-button" type="button" aria-label="Start" aria-expanded="false" aria-controls="start-menu">◈ <span>Start</span></button>
            <div id="task-buttons" aria-label="Open windows"></div>
            <div id="system-tray">
                <button id="volume-button" type="button" aria-label="Mute audio" aria-pressed="false"></button>
                <span id="network-icon" role="img" aria-label="Network status" title="Network status"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8q10-9 20 0M5 12q7-6 14 0M8 16q4-3 8 0" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="20" r="1.5"/></svg></span>
                <button id="notification-button" type="button" aria-label="Notifications" aria-expanded="false" aria-controls="notification-center"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 20h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span id="notification-count"></span></button>
                <time id="clock"></time>
            </div>
        </nav>
        <section id="start-menu" class="shell-panel" aria-label="Start menu" hidden>
            <header><span class="user-avatar" aria-hidden="true">L</span><strong>Lennox</strong><span class="os-label">Lennox_OS</span></header>
            <input id="start-search" type="search" aria-label="Search applications" placeholder="Search applications…" autocomplete="off">
            <div id="start-apps" aria-label="Applications"></div>
            <footer><button id="shutdown-button" type="button">⏻ Shut down</button><button id="restart-button" type="button">↻ Restart</button></footer>
        </section>
        <section id="notification-center" class="shell-panel" aria-label="Notification center" hidden>
            <header><strong>Notifications</strong><button id="clear-notifications" type="button">Clear all</button></header>
            <div id="notification-list"></div>
        </section>
        <div id="toast-region" aria-label="Notifications" aria-live="polite"></div>
        <div id="context-menu" role="menu" aria-label="Context menu" hidden></div>
    </main>
    <button type="button" id="ai-assistant" aria-label="AI assistant: poke">
        <span class="ai-core"><span class="ai-eye"></span></span>
    </button>
    <div class="speech-bubble" id="speech-bubble" aria-hidden="true">...</div>
    <div id="sr-announce" class="sr-only" role="status" aria-live="polite"></div>
    <audio id="audio-intro" src="audio/intro.ogg" preload="auto"></audio>
    <audio id="audio-projects" src="audio/projects.ogg" preload="auto"></audio>
    <!-- Classic scripts: the shell is available before app registration. -->
    <script src="os/shell.js"></script>
    <script src="apps/profile.js"></script>
    <script src="apps/projects.js"></script>
    <script src="apps/terminal.js"></script>
    <script src="apps/files.js"></script>
    <script src="apps/trash.js"></script>
    <script src="apps/editor.js"></script>
    <script src="apps/imageviewer.js"></script>
    <script src="apps/settings.js"></script>
    <script src="apps/btop.js"></script>
    <script src="apps/browser.js"></script>
    <script src="apps/snake.js"></script>
    <script src="apps/minesweeper.js"></script>
    <script src="apps/calculator.js"></script>
    <script src="apps/paint.js"></script>
    <script src="apps/homelab.js"></script>
</body>
</html>
